<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>cyctl Documentation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f9fa;
            color: #333;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 2.4em;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .tagline {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 48px;
        }
        .lang-grid {
            display: flex;
            gap: 24px;
            justify-content: center;
        }
        .lang-card {
            display: block;
            padding: 32px 48px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            background: white;
            transition: all 0.2s;
        }
        .lang-card:hover {
            border-color: #3884ff;
            box-shadow: 0 4px 12px rgba(56, 132, 255, 0.15);
            transform: translateY(-2px);
        }
        .lang-card .flag { font-size: 2em; margin-bottom: 8px; }
        .lang-card .label { font-size: 1.1em; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>cyctl</h1>
        <p class="tagline">Kubernetes Cluster Lifecycle Management</p>
        <div class="lang-grid">
            <a class="lang-card" href="./en/">
                <div class="flag">EN</div>
                <div class="label">English</div>
            </a>
            <a class="lang-card" href="./zh/">
                <div class="flag">中</div>
                <div class="label">中文</div>
            </a>
        </div>
    </div>
</body>
</html>
